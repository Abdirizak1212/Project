<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In – Nadaara Hub</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#0a1628;--navy-mid:#0f2040;--navy-light:#1a3560;
  --gold:#f0a500;--gold-light:#ffc533;--white:#fff;--gray:#94a3b8;
  --error:#ef4444;--success:#22c55e;
}
body{font-family:'Poppins',sans-serif;background:var(--navy);min-height:100vh;display:flex;flex-direction:column}
nav{background:var(--navy-mid);padding:1rem 2rem;display:flex;align-items:center;border-bottom:2px solid var(--gold)}
.logo{display:flex;align-items:center;gap:.75rem;text-decoration:none}
.logo-hex{width:40px;height:40px;background:var(--gold);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:grid;place-items:center;font-weight:700;color:var(--navy);font-size:1.1rem;flex-shrink:0}
.logo-text{color:var(--white);font-weight:700;font-size:1.1rem;letter-spacing:.05em}
.logo-text em{color:var(--gold);font-style:normal}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1rem;background:radial-gradient(ellipse at 20% 50%,rgba(240,165,0,.06) 0%,transparent 60%)}
.card{background:var(--navy-mid);border:1px solid var(--navy-light);border-radius:16px;width:100%;max-width:440px;box-shadow:0 24px 64px rgba(0,0,0,.6)}
.card-top{padding:2rem 2rem 0}
.tabs{display:flex;border-bottom:1px solid var(--navy-light);margin-bottom:1.75rem}
.tab{flex:1;padding:.7rem;text-align:center;cursor:pointer;color:var(--gray);font-size:.88rem;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.2s}
.tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.card-body{padding:0 2rem 2rem}
.pane{display:none}
.pane.on{display:block}
.field{margin-bottom:1.1rem}
.lbl{display:block;color:var(--gray);font-size:.8rem;font-weight:500;margin-bottom:.35rem}
.wrap{position:relative}
input[type=text],input[type=email],input[type=password],select{width:100%;padding:.7rem 1rem;background:rgba(255,255,255,.04);border:1px solid var(--navy-light);border-radius:8px;color:var(--white);font-family:'Poppins',sans-serif;font-size:.88rem;outline:none;transition:.2s}
input:focus,select:focus{border-color:var(--gold);background:rgba(240,165,0,.04)}
select option{background:var(--navy-mid)}
.eye{position:absolute;right:.8rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gray);cursor:pointer;padding:.2rem}
.eye:hover{color:var(--white)}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.1rem}
.chk{display:flex;align-items:center;gap:.4rem;color:var(--gray);font-size:.8rem;cursor:pointer}
.chk input{accent-color:var(--gold)}
.link{color:var(--gold);text-decoration:none;font-size:.8rem}
.link:hover{text-decoration:underline}
.btn{width:100%;padding:.8rem;border:none;border-radius:8px;font-family:'Poppins',sans-serif;font-weight:600;font-size:.9rem;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:.5rem}
.btn-primary{background:var(--gold);color:var(--navy)}
.btn-primary:hover:not(:disabled){background:var(--gold-light)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid var(--navy-light);color:var(--white);margin-top:.7rem}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.sep{display:flex;align-items:center;gap:.75rem;margin:1.1rem 0;color:var(--gray);font-size:.75rem}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--navy-light)}
.alert{padding:.7rem .9rem;border-radius:8px;font-size:.82rem;margin-bottom:1rem;display:none;align-items:flex-start;gap:.5rem}
.alert.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5;display:flex}
.alert.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:#86efac;display:flex}
.spin{width:15px;height:15px;border:2px solid transparent;border-top-color:currentColor;border-radius:50%;animation:rot .6s linear infinite;flex-shrink:0}
@keyframes rot{to{transform:rotate(360deg)}}
.back{text-align:center;margin-top:1.25rem;color:var(--gray);font-size:.8rem}
.terms-row{display:flex;align-items:flex-start;gap:.5rem;color:var(--gray);font-size:.8rem;margin-bottom:1.1rem}
.terms-row input{margin-top:.15rem;accent-color:var(--gold);flex-shrink:0}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">
    <div class="logo-hex">N</div>
    <span class="logo-text">NADAARA <em>HUB</em></span>
  </a>
</nav>
<main>
  <div class="card">
    <div class="card-top">
      <div class="tabs">
        <div class="tab on" onclick="switchTab(0)">Sign In</div>
        <div class="tab" onclick="switchTab(1)">Create Account</div>
      </div>
    </div>
    <div class="card-body">
      <div id="alert" class="alert"></div>
      <div class="pane on" id="pane0">
        <form onsubmit="doLogin(event)">
          <div class="field"><span class="lbl">Email address</span><input type="email" id="li-email" placeholder="you@example.com" autocomplete="email" required></div>
          <div class="field"><span class="lbl">Password</span><div class="wrap"><input type="password" id="li-pw" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password" required><button type="button" class="eye" onclick="toggleEye('li-pw',this)"><i class="fa fa-eye"></i></button></div></div>
          <div class="row"><label class="chk"><input type="checkbox" id="remember"> Remember me</label><a href="#" class="link" onclick="doReset(event)">Forgot password?</a></div>
          <button class="btn btn-primary" id="li-btn" type="submit">Sign In</button>
        </form>
        <div class="sep">or continue with</div>
        <button class="btn btn-ghost" onclick="doGoogle()"><svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Continue with Google</button>
      </div>
      <div class="pane" id="pane1">
        <form onsubmit="doSignup(event)">
          <div class="field"><span class="lbl">Full name</span><input type="text" id="su-name" placeholder="Your full name" autocomplete="name" required></div>
          <div class="field"><span class="lbl">Email address</span><input type="email" id="su-email" placeholder="you@example.com" autocomplete="email" required></div>
          <div class="field"><span class="lbl">Password</span><div class="wrap"><input type="password" id="su-pw" placeholder="Min 8 characters" autocomplete="new-password" required minlength="8"><button type="button" class="eye" onclick="toggleEye('su-pw',this)"><i class="fa fa-eye"></i></button></div></div>
          <div class="field"><span class="lbl">Confirm password</span><input type="password" id="su-pw2" placeholder="Re-enter password" required></div>
          <div class="field"><span class="lbl">I am a</span><select id="su-role"><option value="reader">Reader &mdash; browse &amp; comment</option><option value="contributor">Contributor &mdash; submit articles</option></select></div>
          <div class="terms-row"><input type="checkbox" id="su-terms" required><span>I agree to the <a href="#" class="link">Terms of Service</a> and <a href="#" class="link">Privacy Policy</a></span></div>
          <button class="btn btn-primary" id="su-btn" type="submit">Create Account</button>
        </form>
        <div class="sep">or continue with</div>
        <button class="btn btn-ghost" onclick="doGoogle()"><svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Continue with Google</button>
      </div>
      <div class="back"><a href="index.html" class="link"><i class="fa fa-arrow-left"></i> Back to Nadaara Hub</a></div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>
<script src="supabase-config.js"><\/script>
<script>
function showAlert(msg,type='err'){const el=document.getElementById('alert');el.innerHTML='<span>'+msg+'</span>';el.className='alert '+type;}
function hideAlert(){document.getElementById('alert').className='alert';}
function setBusy(id,busy){const btn=document.getElementById(id);btn.disabled=busy;btn.innerHTML=busy?'<span class="spin"></span> Please wait…':(id==='li-btn'?'Sign In':'Create Account');}
function toggleEye(id,btn){const el=document.getElementById(id);const show=el.type==='password';el.type=show?'text':'password';btn.querySelector('i').className='fa fa-eye'+(show?'-slash':'');}
function switchTab(i){document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on',i===j));document.querySelectorAll('.pane').forEach((p,j)=>p.classList.toggle('on',i===j));hideAlert();}
async function afterAuth(session){const user=session.user;const isAdmin=user.email===ADMIN_EMAIL;const role=isAdmin?'admin':(user.user_metadata?.role||'reader');await db.from('profiles').upsert({id:user.id,full_name:user.user_metadata?.full_name||user.email.split('@')[0],role,avatar_url:user.user_metadata?.avatar_url||null},{onConflict:'id',ignoreDuplicates:false});sessionStorage.setItem('nh_role',role);window.location.href=isAdmin?'admin.html':'index.html';}
async function doLogin(e){e.preventDefault();hideAlert();setBusy('li-btn',true);const email=document.getElementById('li-email').value.trim();const password=document.getElementById('li-pw').value;const{data,error}=await db.auth.signInWithPassword({email,password});if(error){showAlert(friendly(error.message));setBusy('li-btn',false);return;}await afterAuth(data.session);}
async function doSignup(e){e.preventDefault();hideAlert();const pw=document.getElementById('su-pw').value;const pw2=document.getElementById('su-pw2').value;if(pw!==pw2){showAlert('Passwords do not match.');return;}setBusy('su-btn',true);const{data,error}=await db.auth.signUp({email:document.getElementById('su-email').value.trim(),password:pw,options:{data:{full_name:document.getElementById('su-name').value.trim(),role:document.getElementById('su-role').value}}});if(error){showAlert(friendly(error.message));setBusy('su-btn',false);return;}if(data.session){await afterAuth(data.session);return;}showAlert('Check your email to confirm your account, then sign in.','ok');setBusy('su-btn',false);}
async function doGoogle(){hideAlert();const{error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/admin.html'}});if(error)showAlert(friendly(error.message));}
async function doReset(e){e.preventDefault();const email=document.getElementById('li-email').value.trim();if(!email){showAlert('Enter your email above first.');return;}const{error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/login.html'});if(error){showAlert(friendly(error.message));return;}showAlert('Password reset email sent. Check your inbox.','ok');}
db.auth.getSession().then(({data:{session}})=>{if(session)afterAuth(session);});
function friendly(msg){if(msg.includes('Invalid login credentials'))return'Incorrect email or password.';if(msg.includes('Email not confirmed'))return'Please confirm your email first.';if(msg.includes('already registered'))return'This email is already registered. Try signing in.';if(msg.includes('weak'))return'Password must be at least 8 characters.';if(msg.includes('rate limit'))return'Too many attempts. Please wait a moment.';return'Something went wrong. Please try again.';}
<\/script>
</body>
</html>
